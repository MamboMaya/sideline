name: CI

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # macOS-only app (menu bar, cpal/whisper-rs native deps) — Linux lacks
    # the platform this repo targets, so there is no cross-platform matrix.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # No explicit version: reads packageManager from package.json.

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec prettier --check .
      - run: pnpm test

      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo test --release
        working-directory: src-tauri
      # cargo clippy subsumes `cargo check`; no separate check step needed.
      - run: cargo clippy --release -- -D warnings
        working-directory: src-tauri

      # No `tauri build` here: unsigned CI builds can't pass the app's TCC/
      # signing constraints (see CLAUDE.md), so a CI build would prove
      # nothing about the real, signed build.
