[package]
name = "sideline"
version = "0.1.0"
edition = "2021"
description = "macOS menu-bar app for capturing and triaging quick notes"
license = "MIT"
repository = "https://github.com/MamboMaya/sideline"
authors = ["MamboMaya"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
dirs = "6"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
cpal = "0.18.1"
whisper-rs = { version = "0.16.0", features = ["metal"] }
regex = "1.13.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }

[lib]
name = "sideline_lib"
crate-type = ["rlib"]

[lints.clippy]
all = "warn"
